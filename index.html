<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kevin Hub - Free Scripts</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ---------- CORE VARIABLES ---------- */
    :root {
      --bg-base: #070303;
      --bg-surface: #110707;
      --bg-card: #170a0a;
      --bg-card-hover: #1f0d0d;
      
      --red-primary: #e61919;
      --red-bright: #ff3333;
      --red-glow: rgba(230, 25, 25, 0.4);
      --red-glow-strong: rgba(255, 51, 51, 0.6);
      
      --green-primary: #10b981;
      --green-bright: #34d399;
      --green-glow: rgba(16, 185, 129, 0.6);
      
      --yellow-primary: #eab308;
      --yellow-bright: #facc15;
      
      --text-main: #fcf4f4;
      --text-muted: #a88c8c;
      --text-dark: #6b5252;
      
      --border-subtle: #331515;
      --border-active: #5c1f1f;
      
      --discord: #5865F2;
      
      --font-sans: 'Plus Jakarta Sans', sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Glowing background orbs */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
      opacity: 0.4;
      animation: float 20s infinite ease-in-out alternate;
    }
    .orb-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, var(--red-glow) 0%, transparent 70%); animation-delay: 0s; }
    .orb-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(150, 0, 0, 0.3) 0%, transparent 70%); animation-delay: -5s; }
    .orb-3 { top: 40%; left: 60%; width: 30vw; height: 30vw; background: radial-gradient(circle, rgba(255, 50, 50, 0.15) 0%, transparent 70%); animation-delay: -10s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(5%, 10%) scale(1.1); }
      100% { transform: translate(-5%, -5%) scale(0.9); }
    }

    /* ---------- LAYOUT ---------- */
    .hub-container {
      width: 100%;
      max-width: 1400px;
      padding: 2rem 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      position: relative;
      z-index: 1;
    }

    /* ---------- TOP NAVIGATION ---------- */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .discord-link {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(88, 101, 242, 0.1);
      border: 1px solid rgba(88, 101, 242, 0.3);
      color: #b0b5ff;
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border-radius: 2rem;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 15px rgba(88, 101, 242, 0.1);
    }

    .discord-link:hover {
      background: rgba(88, 101, 242, 0.2);
      border-color: var(--discord);
      box-shadow: 0 0 25px rgba(88, 101, 242, 0.4);
      transform: translateY(-2px);
    }

    .discord-link i { font-size: 1.1rem; color: var(--discord); }

    .admin-btn {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 0.6rem 1.2rem;
      border-radius: 2rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s;
    }

    .admin-btn:hover {
      border-color: var(--red-primary);
      color: var(--text-main);
      background: rgba(230, 25, 25, 0.05);
      box-shadow: 0 0 20px var(--red-glow);
    }

    /* ---------- HEADER ---------- */
    .header {
      text-align: center;
      padding: 1.5rem 0;
      animation: fadeInDown 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .header h1 {
      font-family: var(--font-display);
      font-size: 4.5rem;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1.1;
      text-transform: uppercase;
      background: linear-gradient(180deg, #fff 0%, #ffb3b3 50%, var(--red-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px var(--red-glow));
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }

    .header h1 i {
      color: var(--red-bright);
      -webkit-text-fill-color: var(--red-bright);
      font-size: 3.5rem;
      filter: drop-shadow(0 0 15px var(--red-bright));
      animation: pulseIcon 3s infinite alternate;
    }

    @keyframes pulseIcon {
      0% { transform: scale(1) rotate(0deg); }
      100% { transform: scale(1.1) rotate(5deg); filter: drop-shadow(0 0 30px var(--red-bright)); }
    }

    .subhead {
      font-family: var(--font-display);
      color: var(--text-muted);
      font-size: 1rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .subhead::before, .subhead::after {
      content: '';
      height: 1px;
      width: 50px;
      background: linear-gradient(90deg, transparent, var(--red-primary), transparent);
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- LOGIN SCREEN ---------- */
    .login-view {
      display: none;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      animation: fadeIn 0.4s ease;
    }

    .login-view.active { display: flex; }

    .login-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 1.5rem;
      padding: 3rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 40px rgba(230, 25, 25, 0.1);
      position: relative;
      overflow: hidden;
    }

    .login-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--red-bright), transparent);
    }

    .login-box h2 {
      font-family: var(--font-display);
      font-size: 2rem;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .login-box p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .login-box input {
      width: 100%;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: 0.8rem;
      padding: 1rem;
      color: #fff;
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 3px;
      margin-bottom: 1.5rem;
      outline: none;
      transition: all 0.3s;
      font-family: var(--font-display);
    }

    .login-box input:focus {
      border-color: var(--red-bright);
      box-shadow: 0 0 20px var(--red-glow);
    }

    .error-msg {
      color: var(--red-bright);
      font-size: 0.85rem;
      min-height: 1.2rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    /* ---------- MAIN CONTENT AREA ---------- */
    .main-view { display: none; animation: fadeIn 0.5s ease; }
    .main-view.active { display: block; }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      background: rgba(17, 7, 7, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-subtle);
      border-radius: 1rem;
      padding: 1rem 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .search-container {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: 2rem;
      padding: 0.6rem 1.2rem;
      flex: 1 1 300px;
      transition: all 0.3s;
    }

    .search-container:focus-within {
      border-color: var(--red-primary);
      box-shadow: 0 0 15px var(--red-glow);
    }

    .search-container i { color: var(--text-dark); }
    .search-container input {
      background: none;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.95rem;
      width: 100%;
      font-family: var(--font-sans);
    }
    .search-container input::placeholder { color: var(--text-dark); }

    /* Category Pills */
    .category-pills {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      scrollbar-width: thin;
    }
    .category-pills::-webkit-scrollbar { height: 4px; }
    .category-pills::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 4px; }

    .pill {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 0.6rem 1.2rem;
      border-radius: 2rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .pill:hover { border-color: var(--border-active); color: #fff; }
    
    .pill.active {
      background: var(--red-primary);
      border-color: var(--red-bright);
      color: #fff;
      box-shadow: 0 0 20px var(--red-glow);
    }

    /* Script Grid */
    .script-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    /* Card Styling */
    .script-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 1.2rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      transform: translateY(30px);
      animation: cardEnter 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes cardEnter {
      to { opacity: 1; transform: translateY(0); }
    }

    .script-card:hover {
      transform: translateY(-8px) scale(1.01);
      border-color: var(--red-primary);
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 30px var(--red-glow);
      background: var(--bg-card-hover);
      z-index: 10;
    }

    /* Image Container */
    .card-img-container {
      width: 100%;
      height: 200px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
      cursor: pointer;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.6s;
    }
    .script-card:hover .card-img { transform: scale(1.05); }
    
    .img-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, var(--bg-surface), var(--bg-base));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--border-active);
      font-size: 3rem;
    }

    .img-hover-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      pointer-events: none;
      z-index: 10;
    }
    .card-img-container:hover .img-hover-overlay { opacity: 1; }
    .img-hover-overlay i { margin-right: 0.5rem; }

    /* Status Overlay */
    .status-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-5deg);
      font-family: var(--font-display);
      font-size: 3.5rem;
      font-weight: 900;
      color: #ff0000;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0,0,0,0.8), 0 0 20px rgba(255,0,0,0.5);
      z-index: 15;
      pointer-events: none;
      white-space: nowrap;
      letter-spacing: 2px;
      animation: pulseStatus 2s infinite alternate;
    }

    @keyframes pulseStatus {
      0% { transform: translate(-50%, -50%) rotate(-5deg) scale(1); }
      100% { transform: translate(-50%, -50%) rotate(-5deg) scale(1.05); }
    }

    .card-content {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex: 1;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }

    .badge {
      background: rgba(230, 25, 25, 0.1);
      border: 1px solid rgba(230, 25, 25, 0.3);
      color: var(--red-bright);
      padding: 0.2rem 0.6rem;
      border-radius: 1rem;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .access-badge {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--green-bright);
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      align-items: center;
    }

    .card-meta span { display: flex; align-items: center; gap: 0.4rem; }
    .card-meta i { color: var(--red-primary); }

    .code-preview {
      background: #000;
      border: 1px solid var(--border-subtle);
      border-radius: 0.6rem;
      padding: 0.8rem;
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .code-preview:hover { border-color: var(--red-primary); color: #fff; }
    .code-preview i { color: var(--red-primary); }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: auto;
    }

    .btn {
      flex: 1;
      padding: 0.8rem;
      border-radius: 0.6rem;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border: none;
      position: relative;
      overflow: hidden;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--red-primary), #990000);
      color: #fff;
      box-shadow: 0 4px 15px rgba(230, 25, 25, 0.4);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--red-bright), var(--red-primary));
      box-shadow: 0 8px 25px var(--red-glow-strong);
      transform: translateY(-2px);
    }

    .btn-primary.copied {
      background: linear-gradient(135deg, var(--green-primary), #047857);
      box-shadow: 0 4px 20px var(--green-glow);
      animation: pulseGreen 0.5s ease;
    }

    @keyframes pulseGreen {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-active);
      color: var(--text-muted);
    }

    .btn-outline:hover {
      border-color: var(--red-primary);
      color: #fff;
      background: rgba(230, 25, 25, 0.05);
    }
    
    .btn-edit {
      background: rgba(234, 179, 8, 0.1);
      border: 1px solid rgba(234, 179, 8, 0.3);
      color: var(--yellow-bright);
      flex: 0.5;
    }
    .btn-edit:hover {
      background: var(--yellow-primary);
      color: #000;
      border-color: var(--yellow-bright);
    }

    .btn-webhook {
      background: rgba(88, 101, 242, 0.1);
      border: 1px solid rgba(88, 101, 242, 0.3);
      color: #b0b5ff;
      flex: 0.5;
    }
    .btn-webhook:hover {
      background: var(--discord);
      color: #fff;
      border-color: var(--discord);
    }

    /* Admin overlays */
    .admin-overlay {
      position: absolute;
      top: 1rem; right: 1rem;
      display: flex;
      gap: 0.5rem;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s;
      z-index: 20;
    }
    .script-card:hover .admin-overlay { opacity: 1; transform: translateY(0); }
    
    .icon-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      border: 1px solid var(--border-subtle);
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .icon-btn:hover { background: var(--red-primary); border-color: var(--red-bright); transform: scale(1.1); }
    .icon-btn.delete:hover { background: #ff0000; }

    /* ---------- ADMIN FORM ---------- */
    .admin-layout {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
    }

    .admin-sidebar {
      flex: 0 0 350px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 1.2rem;
      padding: 1.5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      position: sticky;
      top: 2rem;
    }

    .admin-sidebar h3 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 1rem;
    }
    .admin-sidebar h3 i { color: var(--red-primary); }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    .form-control {
      width: 100%;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: 0.6rem;
      padding: 0.8rem 1rem;
      color: #fff;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }

    textarea.form-control { font-family: monospace; min-height: 100px; resize: vertical; }

    .form-control:focus {
      border-color: var(--red-primary);
      box-shadow: 0 0 15px var(--red-glow);
    }

    .image-upload-wrapper {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: var(--bg-base);
      border: 1px dashed var(--border-active);
      border-radius: 0.6rem;
      padding: 1rem;
      text-align: center;
      position: relative;
      transition: all 0.2s;
    }
    .image-upload-wrapper:hover { border-color: var(--red-primary); }
    .image-upload-wrapper input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }
    .image-upload-wrapper i { font-size: 2rem; color: var(--text-dark); margin-bottom: 0.5rem; }
    .image-upload-wrapper span { font-size: 0.8rem; color: var(--text-muted); }
    .image-preview-thumb {
      max-width: 100%;
      max-height: 100px;
      object-fit: contain;
      border-radius: 0.4rem;
      margin-top: 0.5rem;
    }

    .category-manager {
      background: var(--bg-base);
      border: 1px dashed var(--border-active);
      border-radius: 0.6rem;
      padding: 1rem;
      margin-top: 0.5rem;
    }

    .cat-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .cat-tag {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 0.3rem 0.6rem;
      border-radius: 1rem;
      font-size: 0.75rem;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .cat-tag i { cursor: pointer; color: var(--text-dark); transition: color 0.2s; }
    .cat-tag i:hover { color: var(--red-bright); }

    .cat-input-group { display: flex; gap: 0.5rem; }
    .cat-input-group input { flex: 1; padding: 0.5rem; font-size: 0.8rem; }
    .cat-input-group button {
      background: var(--bg-card-hover); border: 1px solid var(--border-subtle);
      color: var(--red-primary); padding: 0 1rem; border-radius: 0.5rem; cursor: pointer;
      font-weight: bold; transition: all 0.2s;
    }
    .cat-input-group button:hover { background: var(--red-primary); color: #fff; }

    /* ---------- SINGLE SCRIPT VIEW (VIEW PAGE) ---------- */
    #viewScriptPage {
      display: none;
      animation: fadeIn 0.5s ease;
    }
    #viewScriptPage.active { display: block; }

    .view-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 0.6rem 1.2rem;
      border-radius: 2rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 2rem;
      transition: all 0.2s;
    }
    .view-back-btn:hover {
      border-color: var(--red-primary);
      color: #fff;
      background: rgba(230,25,25,0.05);
      transform: translateX(-5px);
    }

    .view-script-container {
      display: flex;
      gap: 2rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    @media (max-width: 900px) {
      .view-script-container { flex-direction: column; }
    }

    .view-script-image {
      flex: 1 1 50%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 400px;
      position: relative;
    }

    .view-script-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      max-height: 600px;
    }

    .view-script-image .img-placeholder {
      font-size: 5rem;
    }

    .view-script-details {
      flex: 1 1 50%;
      padding: 3rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .view-script-title {
      font-family: var(--font-display);
      font-size: 2.5rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
    }

    .view-script-category {
      display: inline-block;
      align-self: flex-start;
      background: rgba(230,25,25,0.1);
      border: 1px solid rgba(230,25,25,0.3);
      color: var(--red-bright);
      padding: 0.3rem 0.8rem;
      border-radius: 1rem;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .view-script-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 1.5rem;
    }

    .view-script-meta i { color: var(--red-primary); margin-right: 0.4rem; }

    .view-code-box {
      background: #000;
      border: 1px solid var(--border-subtle);
      border-radius: 0.8rem;
      padding: 1.5rem;
      font-family: monospace;
      font-size: 1rem;
      color: #a88c8c;
      line-height: 1.6;
      word-break: break-all;
      white-space: pre-wrap;
      position: relative;
    }

    .view-copy-btn {
      align-self: flex-start;
      padding: 1rem 2rem;
      font-size: 1rem;
      border-radius: 2rem;
    }

    /* ---------- GREEN COPIED TOAST ---------- */
    .toast {
      position: fixed;
      bottom: 2rem; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-surface);
      border: 1px solid var(--red-primary);
      color: #fff;
      padding: 0.8rem 1.8rem;
      border-radius: 3rem;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 20px var(--red-glow);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      z-index: 9999;
      display: flex; align-items: center; gap: 0.6rem;
    }
    
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast i { color: var(--red-bright); }

    .toast.success {
      border-color: var(--green-primary);
      box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 25px var(--green-glow);
    }
    .toast.success i { color: var(--green-bright); }

    .particle {
      position: absolute;
      background: var(--green-bright);
      border-radius: 50%;
      pointer-events: none;
      opacity: 1;
      animation: particleBurst 0.8s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
      z-index: 100;
    }
    
    @keyframes particleBurst {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 5rem 1rem;
      background: var(--bg-surface);
      border: 1px dashed var(--border-subtle);
      border-radius: 1.2rem;
    }
    .empty-state i { font-size: 4rem; color: var(--border-active); margin-bottom: 1rem; }
    .empty-state h3 { font-family: var(--font-display); font-size: 1.5rem; color: #fff; margin-bottom: 0.5rem; }
    .empty-state p { color: var(--text-muted); }

    /* ---------- LIGHTBOX ---------- */
    .lightbox {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .lightbox.active { opacity: 1; pointer-events: auto; }

    .lightbox-img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 1rem;
      box-shadow: 0 0 50px rgba(230, 25, 25, 0.3);
      transform: scale(0.95);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .lightbox.active .lightbox-img { transform: scale(1); }

    .lightbox-close {
      position: absolute;
      top: 2rem; right: 2rem;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      width: 50px; height: 50px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }

    .lightbox-close:hover {
      background: var(--red-primary);
      border-color: var(--red-bright);
      transform: rotate(90deg) scale(1.1);
    }

    @media (max-width: 600px) {
      .hub-container { padding: 1rem; }
      .header h1 { font-size: 2.8rem; flex-direction: column; gap: 0.5rem; }
      .header h1 i { font-size: 2.5rem; }
      .filter-bar { flex-direction: column; align-items: stretch; }
      .login-box { padding: 2rem 1.5rem; }
      .view-script-details { padding: 1.5rem; }
      .view-script-title { font-size: 2rem; }
      .status-overlay { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div class="hub-container">
    <!-- TOP NAV -->
    <div class="top-nav">
      <a href="https://discord.gg/luascript" target="_blank" class="discord-link">
        <i class="fab fa-discord"></i> discord.gg/luascript
      </a>
      <button class="admin-btn" id="adminToggleBtn">
        <i class="fas fa-lock"></i> Admin
      </button>
    </div>

    <!-- HEADER -->
    <header class="header" id="mainHeader" onclick="goHome(event)">
      <h1>
        <i class="fas fa-code"></i>
        Kevin Hub
      </h1>
      <div class="subhead">List Scripts</div>
    </header>

    <!-- LOGIN VIEW -->
    <div class="login-view" id="loginView">
      <div class="login-box">
        <h2>Admin Access</h2>
        <p>Enter password to manage scripts</p>
        <input type="password" id="adminPassword" placeholder="••••••••••" autocomplete="off">
        <div class="error-msg" id="loginError"></div>
        <button class="btn btn-primary" id="loginBtn" style="width: 100%; margin-bottom: 1rem; padding: 1rem;">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
        <button class="btn btn-outline" id="cancelLoginBtn" style="width: 100%;">
          Cancel
        </button>
      </div>
    </div>

    <!-- MAIN PUBLIC VIEW -->
    <div class="main-view" id="publicView">
      <div class="filter-bar">
        <div class="search-container">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search scripts by name or category...">
        </div>
      </div>

      <div class="category-pills" id="categoryPills" style="margin-bottom: 2rem;">
        <button class="pill active" data-cat="All">All Scripts</button>
      </div>

      <div class="script-grid" id="publicGrid"></div>
    </div>

    <!-- SINGLE SCRIPT VIEW (PAGE) -->
    <div id="viewScriptPage">
      <button class="view-back-btn" onclick="goHome(event)">
        <i class="fas fa-arrow-left"></i> Back to all scripts
      </button>

      <div class="view-script-container" id="viewScriptContainer">
        <!-- Injected via JS -->
      </div>
    </div>

    <!-- ADMIN VIEW -->
    <div class="main-view" id="adminView">
      <div class="admin-layout">
        <aside class="admin-sidebar">
          <h3><i class="fas fa-layer-group"></i> <span id="formTitle">Manage Scripts</span></h3>
          
          <input type="hidden" id="editScriptId">
          
          <div class="form-group">
            <label>Webhook URL (Saved)</label>
            <input type="url" id="webhookUrl" class="form-control" placeholder="https://discord.com/api/webhooks/...">
            <span style="font-size: 0.65rem; color: var(--text-dark); margin-top: 0.3rem; display: block;">Saved automatically.</span>
          </div>

          <div class="form-group">
            <label>Script Name</label>
            <input type="text" id="scriptName" class="form-control" placeholder="e.g. Dice Predictor">
          </div>

          <div style="display: flex; gap: 1rem;">
            <div class="form-group" style="flex: 1;">
              <label>Status</label>
              <select id="scriptStatus" class="form-control">
                <option value="Working">🟢 Working</option>
                <option value="Patched">🔴 Patched</option>
                <option value="Updating">🟡 Updating</option>
                <option value="Detected">⚠️ Detected</option>
              </select>
            </div>
            <div class="form-group" style="flex: 1;">
              <label>Access Type</label>
              <select id="scriptAccess" class="form-control">
                <option value="Keyless">🔓 Keyless</option>
                <option value="Key System">🔑 Key System</option>
                <option value="Paid">💰 Paid</option>
                <option value="Whitelist">📋 Whitelist</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Category</label>
            <select id="scriptCategory" class="form-control"></select>
            
            <div class="category-manager">
              <label style="margin-bottom: 0.5rem; display: block; font-size: 0.7rem; color: var(--text-muted);">Create Categories</label>
              <div class="cat-tags" id="catTagList"></div>
              <div class="cat-input-group">
                <input type="text" id="newCatInput" class="form-control" placeholder="New category...">
                <button id="addCatBtn">Add</button>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Image (Upload or URL)</label>
            <div class="image-upload-wrapper" id="imageUploadWrapper">
              <input type="file" id="scriptImageFile" accept="image/*">
              <i class="fas fa-cloud-upload-alt"></i>
              <span>Click or Drag to upload image</span>
              <img id="imagePreviewThumb" class="image-preview-thumb" style="display: none;">
            </div>
            <input type="url" id="scriptImageUrl" class="form-control" placeholder="Or paste image URL..." style="margin-top: 0.5rem; font-size: 0.8rem;">
          </div>

          <div class="form-group">
            <label>Script Code</label>
            <textarea id="scriptCode" class="form-control" placeholder='loadstring(game:HttpGet("..."))()'></textarea>
          </div>

          <div class="form-group">
            <label>Price Tag (Optional)</label>
            <input type="text" id="scriptPrice" class="form-control" placeholder="e.g. $5, Free, Premium">
          </div>

          <button class="btn btn-primary" id="saveScriptBtn" style="width: 100%; margin-bottom: 0.8rem; padding: 1rem;">
            <i class="fas fa-upload"></i> Post Script
          </button>
          
          <button class="btn btn-outline" id="cancelEditBtn" style="width: 100%; margin-bottom: 0.8rem; display: none;">
            Cancel Edit
          </button>

          <div style="display: flex; gap: 0.5rem; margin-top: 1.5rem; border-top: 1px solid var(--border-subtle); padding-top: 1.5rem;">
            <button class="btn btn-outline" id="logoutBtn" style="flex:1;">Logout</button>
          </div>
        </aside>

        <div class="script-grid" id="adminGrid" style="flex: 1;"></div>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <i class="fas fa-check-circle"></i> <span id="toastMsg">Done!</span>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()"><i class="fas fa-times"></i></button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="Expanded Image">
  </div>

  <script>
    (function() {
      // ---------- CONFIG ----------
      const ADMIN_PASSWORD = 'kevinontop';
      const DEFAULT_CATEGORIES = [];
      const DEFAULT_SCRIPTS = [];

      // ---------- STATE ----------
      let scripts = [];
      let categories = [];
      let isAdmin = false;
      let currentCatFilter = 'All';
      let currentSearch = '';
      let currentBase64Image = '';

      // ---------- DOM ----------
      const publicView = document.getElementById('publicView');
      const adminView = document.getElementById('adminView');
      const loginView = document.getElementById('loginView');
      const viewScriptPage = document.getElementById('viewScriptPage');
      const viewScriptContainer = document.getElementById('viewScriptContainer');
      
      const adminToggleBtn = document.getElementById('adminToggleBtn');
      
      const publicGrid = document.getElementById('publicGrid');
      const adminGrid = document.getElementById('adminGrid');
      
      const categoryPills = document.getElementById('categoryPills');
      const searchInput = document.getElementById('searchInput');
      
      // Form
      const formTitle = document.getElementById('formTitle');
      const editScriptId = document.getElementById('editScriptId');
      const webhookUrl = document.getElementById('webhookUrl');
      const scriptName = document.getElementById('scriptName');
      const scriptStatus = document.getElementById('scriptStatus');
      const scriptAccess = document.getElementById('scriptAccess');
      const scriptCategory = document.getElementById('scriptCategory');
      const scriptImageUrl = document.getElementById('scriptImageUrl');
      const scriptImageFile = document.getElementById('scriptImageFile');
      const imagePreviewThumb = document.getElementById('imagePreviewThumb');
      const scriptCode = document.getElementById('scriptCode');
      const scriptPrice = document.getElementById('scriptPrice');
      const saveScriptBtn = document.getElementById('saveScriptBtn');
      const cancelEditBtn = document.getElementById('cancelEditBtn');
      
      const catTagList = document.getElementById('catTagList');
      const newCatInput = document.getElementById('newCatInput');
      const addCatBtn = document.getElementById('addCatBtn');
      
      const adminPassword = document.getElementById('adminPassword');
      const loginError = document.getElementById('loginError');
      const loginBtn = document.getElementById('loginBtn');
      const cancelLoginBtn = document.getElementById('cancelLoginBtn');
      
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');

      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');

      // ---------- UTILS ----------
      function showToast(msg, isSuccess = false) {
        toastMsg.textContent = msg;
        toast.classList.add('show');
        if (isSuccess) toast.classList.add('success');
        else toast.classList.remove('success');
        
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
      }

      function escapeHTML(str) {
        if (!str) return '';
        return str.replace(/[&<>'"]/g, tag => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[tag]));
      }

      function slugify(text) {
        return text.toString().toLowerCase()
          .replace(/\s+/g, '-')
          .replace(/[^\w\-]+/g, '')
          .replace(/\-\-+/g, '-')
          .replace(/^-+/, '')
          .replace(/-+$/, '');
      }

      function getIcon(cat) {
        const c = (cat || '').toLowerCase();
        if (c.includes('predict') || c.includes('dice')) return 'fa-dice';
        if (c.includes('farm') || c.includes('auto')) return 'fa-hat-wizard';
        if (c.includes('esp') || c.includes('aim')) return 'fa-crosshairs';
        if (c.includes('util') || c.includes('inf')) return 'fa-gem';
        return 'fa-file-code';
      }

      function getStatusColor(status) {
        switch(status) {
          case 'Patched': return '#ff3333';
          case 'Updating': return '#eab308';
          case 'Detected': return '#f97316';
          default: return '#4ade80';
        }
      }

      // ---------- LIGHTBOX ----------
      window.openLightbox = function(src) {
        if (!src) return;
        lightboxImg.src = src;
        lightbox.classList.add('active');
      }

      window.closeLightbox = function() {
        lightbox.classList.remove('active');
        setTimeout(() => { lightboxImg.src = ''; }, 300);
      }

      lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
      });

      // ---------- STORAGE ----------
      function loadData() {
        const c = localStorage.getItem('kevinHub_cats_v14');
        const s = localStorage.getItem('kevinHub_scripts_v14');
        const w = localStorage.getItem('kevinHub_webhook_v14');
        
        categories = c ? JSON.parse(c) : [...DEFAULT_CATEGORIES];
        scripts = s ? JSON.parse(s) : [...DEFAULT_SCRIPTS];
        
        if (w) webhookUrl.value = w;
      }

      function saveData() {
        localStorage.setItem('kevinHub_cats_v14', JSON.stringify(categories));
        localStorage.setItem('kevinHub_scripts_v14', JSON.stringify(scripts));
      }

      // Save webhook on input
      webhookUrl.addEventListener('input', (e) => {
        localStorage.setItem('kevinHub_webhook_v14', e.target.value.trim());
      });

      // ---------- ROUTING ----------
      window.goHome = function(e) {
        if(e) e.preventDefault();
        window.location.hash = '';
      }

      function handleRoute() {
        const hash = window.location.hash;
        
        publicView.classList.remove('active');
        adminView.classList.remove('active');
        loginView.classList.remove('active');
        viewScriptPage.classList.remove('active');

        if (hash.startsWith('#/script/')) {
          const slug = hash.replace('#/script/', '');
          const script = scripts.find(s => slugify(s.name) === slug);
          
          if (script) {
            renderSingleScript(script);
            viewScriptPage.classList.add('active');
            window.scrollTo(0, 0);
            return;
          }
        }

        if (isAdmin) {
          adminView.classList.add('active');
        } else {
          publicView.classList.add('active');
        }
      }

      window.onhashchange = handleRoute;

      // ---------- RENDER SINGLE SCRIPT ----------
      function renderSingleScript(script) {
        const imgSrc = script.image || '';
        const statusColor = getStatusColor(script.status);
        
        viewScriptContainer.innerHTML = `
          <div class="view-script-image" ${imgSrc ? `onclick="openLightbox('${imgSrc}')" style="cursor:pointer;"` : ''}>
            ${imgSrc 
              ? `<img src="${imgSrc}" alt="${escapeHTML(script.name)}">`
              : `<div class="img-placeholder"><i class="fas ${getIcon(script.category)}"></i></div>`
            }
          </div>
          <div class="view-script-details">
            <div>
              <h2 class="view-script-title">${escapeHTML(script.name)}</h2>
              <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:0.5rem;">
                ${script.category ? `<div class="view-script-category">${escapeHTML(script.category)}</div>` : ''}
                <div class="view-script-category" style="background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.3); color: var(--green-bright);">
                  <i class="fas fa-key" style="margin-right:0.3rem;"></i> ${escapeHTML(script.access || 'Keyless')}
                </div>
              </div>
            </div>
            
            <div class="view-script-meta">
              <span>
                <i class="fas fa-circle" style="color: ${statusColor}; font-size: 0.6rem;"></i> 
                Status: <strong style="margin-left:0.3rem; color: ${statusColor};">${escapeHTML(script.status || 'Working')}</strong>
              </span>
              <span><i class="fas fa-star"></i> 5.0 Rating</span>
              ${script.price ? `<span><i class="fas fa-tag"></i> ${escapeHTML(script.price)}</span>` : ''}
            </div>

            <div class="view-code-box" id="view-code">${escapeHTML(script.code)}</div>
            
            <button class="btn btn-primary view-copy-btn" id="copy-btn-view">
              <i class="fas fa-copy"></i> Copy Script
            </button>
          </div>
        `;

        // Add event listener for copy button in view page
        document.getElementById('copy-btn-view').onclick = function() {
          copyCode(script.id, this);
        };
      }

      // ---------- RENDER CATEGORIES ----------
      function renderCategories() {
        let html = `<button class="pill ${currentCatFilter === 'All' ? 'active' : ''}" data-cat="All">All Scripts</button>`;
        categories.forEach(cat => {
          html += `<button class="pill ${currentCatFilter === cat ? 'active' : ''}" data-cat="${escapeHTML(cat)}">${escapeHTML(cat)}</button>`;
        });
        categoryPills.innerHTML = html;

        document.querySelectorAll('.pill').forEach(btn => {
          btn.onclick = (e) => {
            currentCatFilter = e.target.getAttribute('data-cat');
            renderCategories();
            filterPublic();
          };
        });

        const val = scriptCategory.value;
        scriptCategory.innerHTML = categories.length 
          ? categories.map(c => `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join('')
          : '<option value="">-- No categories yet --</option>';
        if (categories.includes(val)) scriptCategory.value = val;

        catTagList.innerHTML = categories.map(c => `
          <span class="cat-tag">
            ${escapeHTML(c)}
            <i class="fas fa-times" onclick="removeCategory('${escapeHTML(c)}')"></i>
          </span>
        `).join('') || '<span style="font-size:0.8rem; color:var(--text-dark);">No categories created.</span>';
      }

      window.removeCategory = function(cat) {
        const used = scripts.filter(s => s.category === cat).length;
        if (used > 0) {
          if (!confirm(`Category "${cat}" is used by ${used} script(s). Delete it and move scripts to uncategorized?`)) return;
          scripts.forEach(s => { if (s.category === cat) s.category = 'Uncategorized'; });
        }
        categories = categories.filter(c => c !== cat);
        saveData();
        renderCategories();
        renderAdmin();
        filterPublic();
        showToast('Category removed');
      };

      // ---------- RENDER GRIDS ----------
      function createCard(script, isAdminView, index) {
        const id = `code-${isAdminView ? 'adm' : 'pub'}-${index}`;
        const delay = (index * 0.05).toFixed(2);
        const imgSrc = script.image || '';
        const slug = slugify(script.name);
        
        const isPatched = script.status === 'Patched';
        const statusColor = getStatusColor(script.status);
        
        let accessBadgeStyle = '';
        if (script.access === 'Key System') accessBadgeStyle = 'background: rgba(234, 179, 8, 0.1); border-color: rgba(234, 179, 8, 0.3); color: var(--yellow-bright);';
        if (script.access === 'Paid') accessBadgeStyle = 'background: rgba(230, 25, 25, 0.1); border-color: rgba(230, 25, 25, 0.3); color: var(--red-bright);';

        return `
          <div class="script-card" style="animation-delay: ${delay}s">
            ${isAdminView ? `
              <div class="admin-overlay">
                <button class="icon-btn" onclick="editScript('${script.id}')"><i class="fas fa-pen"></i></button>
                <button class="icon-btn delete" onclick="deleteScript('${script.id}')"><i class="fas fa-trash"></i></button>
              </div>
            ` : ''}

            <div class="card-img-container" ${imgSrc ? `onclick="openLightbox('${imgSrc}')"` : ''}>
              ${imgSrc 
                ? `<img src="${imgSrc}" class="card-img" onerror="this.src=''; this.style.display='none'; this.nextElementSibling.style.display='flex';">
                   <div class="img-hover-overlay"><i class="fas fa-expand"></i> View Full Image</div>`
                : `<div class="img-placeholder"><i class="fas ${getIcon(script.category)}"></i></div>`
              }
              ${isPatched ? `<div class="status-overlay">Patched</div>` : ''}
            </div>

            <div class="card-content">
              <div class="card-header">
                <div class="card-title">${escapeHTML(script.name)}</div>
                <div style="display:flex; gap:0.4rem; flex-wrap:wrap;">
                  ${script.category ? `<span class="badge">${escapeHTML(script.category)}</span>` : ''}
                  ${script.access ? `<span class="badge" style="${accessBadgeStyle}">${escapeHTML(script.access)}</span>` : ''}
                </div>
              </div>
              
              <div class="card-meta">
                <span>
                  <i class="fas fa-circle" style="color: ${statusColor}; font-size: 0.6rem;"></i> 
                  ${escapeHTML(script.status || 'Working')}
                </span>
                <span><i class="fas fa-star"></i> 5.0</span>
              </div>

              <div class="code-preview" onclick="copyCode('${script.id}', this)">
                <span id="${id}">${escapeHTML(script.code).substring(0, 30)}...</span>
                <i class="fas fa-copy"></i>
              </div>

              <div class="card-actions">
                ${!isAdminView ? `
                  <a href="#/script/${slug}" class="btn btn-outline">
                    <i class="fas fa-eye"></i> View
                  </a>
                ` : `
                  <button class="btn btn-edit" onclick="editScript('${script.id}')">
                    <i class="fas fa-pen"></i> Edit
                  </button>
                  <button class="btn btn-webhook" onclick="manualSendWebhook('${script.id}')" title="Send to Webhook">
                    <i class="fab fa-discord"></i> Send
                  </button>
                `}
                <button class="btn btn-primary" onclick="copyCode('${script.id}', this)">
                  <i class="fas fa-copy"></i> Copy
                </button>
              </div>
            </div>
          </div>
        `;
      }

      function filterPublic() {
        let filtered = [...scripts];
        
        if (currentSearch) {
          const q = currentSearch.toLowerCase();
          filtered = filtered.filter(s => 
            s.name.toLowerCase().includes(q) || 
            (s.category && s.category.toLowerCase().includes(q))
          );
        }
        
        if (currentCatFilter !== 'All') {
          filtered = filtered.filter(s => s.category === currentCatFilter);
        }

        if (filtered.length === 0) {
          publicGrid.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-ghost"></i>
              <h3>No scripts found</h3>
              <p>Try a different search or check back later.</p>
            </div>
          `;
          return;
        }

        publicGrid.innerHTML = filtered.map((s, i) => createCard(s, false, i)).join('');
      }

      function renderAdmin() {
        if (scripts.length === 0) {
          adminGrid.innerHTML = `
            <div class="empty-state" style="grid-column: 1/-1;">
              <i class="fas fa-plus-circle"></i>
              <h3>No scripts posted yet</h3>
              <p>Use the form on the left to add your first script.</p>
            </div>
          `;
          return;
        }
        adminGrid.innerHTML = scripts.map((s, i) => createCard(s, true, i)).join('');
      }

      // ---------- ACTIONS ----------
      window.copyCode = function(scriptId, btnElement) {
        const script = scripts.find(s => s.id === scriptId);
        if (!script) return;
        
        navigator.clipboard.writeText(script.code).then(() => {
          if (btnElement && btnElement.classList.contains('btn')) {
            const originalHTML = btnElement.innerHTML;
            
            btnElement.classList.add('copied');
            btnElement.innerHTML = '<i class="fas fa-check"></i> Copied!';
            
            spawnParticles(btnElement);

            setTimeout(() => {
              btnElement.classList.remove('copied');
              btnElement.innerHTML = originalHTML;
            }, 2000);
          }

          showToast('✅ Script copied to clipboard!', true);

        }).catch(() => {
          const ta = document.createElement('textarea');
          ta.value = script.code;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToast('✅ Script copied!', true);
        });
      };

      function spawnParticles(container) {
        const rect = container.getBoundingClientRect();
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        for (let i = 0; i < 12; i++) {
          const particle = document.createElement('div');
          particle.classList.add('particle');
          
          const size = Math.random() * 8 + 4;
          particle.style.width = size + 'px';
          particle.style.height = size + 'px';
          particle.style.left = centerX + 'px';
          particle.style.top = centerY + 'px';

          const angle = Math.random() * Math.PI * 2;
          const distance = Math.random() * 60 + 30;
          const tx = Math.cos(angle) * distance;
          const ty = Math.sin(angle) * distance;

          particle.style.setProperty('--tx', tx + 'px');
          particle.style.setProperty('--ty', ty + 'px');

          container.appendChild(particle);

          setTimeout(() => {
            if (particle.parentNode) particle.remove();
          }, 800);
        }
      }

      window.deleteScript = function(id) {
        if (!confirm('Are you sure you want to delete this script?')) return;
        scripts = scripts.filter(s => s.id !== id);
        saveData();
        renderAdmin();
        filterPublic();
        showToast('Script deleted');
      };

      window.editScript = function(id) {
        const s = scripts.find(x => x.id === id);
        if (!s) {
          showToast('Error: Script not found');
          return;
        }
        
        formTitle.textContent = 'Edit Script';
        editScriptId.value = s.id;
        scriptName.value = s.name;
        scriptStatus.value = s.status || 'Working';
        scriptAccess.value = s.access || 'Keyless';
        scriptCategory.value = s.category;
        scriptCode.value = s.code;
        scriptPrice.value = s.price || '';
        
        if (s.image && s.image.startsWith('data:image')) {
          currentBase64Image = s.image;
          scriptImageUrl.value = '';
          imagePreviewThumb.src = s.image;
          imagePreviewThumb.style.display = 'block';
        } else {
          currentBase64Image = '';
          scriptImageUrl.value = s.image || '';
          imagePreviewThumb.src = '';
          imagePreviewThumb.style.display = 'none';
        }
        
        cancelEditBtn.style.display = 'block';
        saveScriptBtn.innerHTML = '<i class="fas fa-save"></i> Update Script';
        document.querySelector('.admin-sidebar').scrollIntoView({ behavior: 'smooth', block: 'start' });
        showToast('Loaded script for editing');
      };

      function resetForm() {
        formTitle.textContent = 'Manage Scripts';
        editScriptId.value = '';
        scriptName.value = '';
        scriptStatus.value = 'Working';
        scriptAccess.value = 'Keyless';
        scriptImageUrl.value = '';
        scriptCode.value = '';
        scriptPrice.value = '';
        currentBase64Image = '';
        imagePreviewThumb.src = '';
        imagePreviewThumb.style.display = 'none';
        scriptImageFile.value = '';
        cancelEditBtn.style.display = 'none';
        saveScriptBtn.innerHTML = '<i class="fas fa-upload"></i> Post Script';
      }

      // ---------- VIEW SWITCHING ----------
      function showPublic() {
        window.location.hash = '';
        isAdmin = false;
        adminToggleBtn.innerHTML = '<i class="fas fa-lock"></i> Admin';
      }

      function showLogin() {
        loginView.classList.add('active');
        publicView.classList.remove('active');
        adminView.classList.remove('active');
        viewScriptPage.classList.remove('active');
        adminPassword.value = '';
        loginError.textContent = '';
        adminToggleBtn.style.display = 'none';
        setTimeout(() => adminPassword.focus(), 100);
      }

      function showAdmin() {
        isAdmin = true;
        handleRoute(); 
        adminToggleBtn.innerHTML = '<i class="fas fa-unlock"></i> Admin';
        adminToggleBtn.style.display = 'inline-flex';
        
        renderCategories();
        renderAdmin();
        resetForm();
      }

      // ---------- WEBHOOK ----------
      async function sendWebhook(script, webhook) {
        if (!webhook || !webhook.startsWith('http')) return;

        // Generate the slug for the URL
        const slug = slugify(script.name);
        const previewUrl = `https://kevin-hub-scripts.itskevin.workers.dev/#/script/${slug}`;

        const embed = {
          title: `Kevin Hub  |  ${script.name} [${script.category}]`,
          description: `tap to copy:\n\`\`\`${script.code}\`\`\``,
          color: 15158332, // Red color hex
          image: {
            url: script.image || ''
          },
          footer: {
            text: "discord.gg/luascript"
          }
        };

        const payload = {
          embeds: [embed],
          components: [
            {
              type: 1, // Action Row
              components: [
                {
                  type: 2, // Button
                  label: "Preview",
                  style: 5, // Link Button
                  url: previewUrl,
                  emoji: {
                    name: "💎"
                  }
                }
              ]
            }
          ]
        };

        try {
          await fetch(webhook, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });
        } catch (err) {
          console.error('Webhook failed', err);
        }
      }

      window.manualSendWebhook = async function(id) {
        const script = scripts.find(s => s.id === id);
        if (!script) return;
        
        const webhook = webhookUrl.value.trim();
        if (!webhook) {
          showToast('❌ No Webhook URL saved!');
          return;
        }
        
        showToast('Sending to Discord...');
        await sendWebhook(script, webhook);
        showToast('✅ Sent to Discord!', true);
      };

      // ---------- INIT ----------
      function init() {
        loadData();
        renderCategories();
        handleRoute();

        adminToggleBtn.onclick = () => {
          if (isAdmin) { showPublic(); showToast('Logged out'); }
          else { showLogin(); }
        };

        loginBtn.onclick = () => {
          if (adminPassword.value === ADMIN_PASSWORD) {
            showAdmin();
            showToast('Welcome back, Kevin!');
          } else {
            loginError.textContent = '❌ Incorrect password';
            adminPassword.value = '';
            adminPassword.focus();
            adminPassword.style.borderColor = 'var(--red-bright)';
            setTimeout(() => adminPassword.style.borderColor = '', 800);
          }
        };
        adminPassword.onkeydown = (e) => { if (e.key === 'Enter') loginBtn.click(); };
        cancelLoginBtn.onclick = showPublic;
        document.getElementById('logoutBtn').onclick = showPublic;

        searchInput.oninput = (e) => {
          currentSearch = e.target.value;
          filterPublic();
        };

        addCatBtn.onclick = () => {
          const val = newCatInput.value.trim();
          if (!val) return;
          if (categories.includes(val)) { showToast('Category already exists!'); return; }
          categories.push(val);
          saveData();
          renderCategories();
          newCatInput.value = '';
          showToast('Category created!');
        };
        newCatInput.onkeydown = (e) => { if (e.key === 'Enter') addCatBtn.click(); };

        scriptImageFile.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          
          const reader = new FileReader();
          reader.onload = (event) => {
            currentBase64Image = event.target.result;
            imagePreviewThumb.src = currentBase64Image;
            imagePreviewThumb.style.display = 'block';
            scriptImageUrl.value = '';
          };
          reader.readAsDataURL(file);
        };

        scriptImageUrl.oninput = (e) => {
          if (e.target.value.trim()) {
            currentBase64Image = '';
            imagePreviewThumb.src = '';
            imagePreviewThumb.style.display = 'none';
            scriptImageFile.value = '';
          }
        };

        saveScriptBtn.onclick = async () => {
          const id = editScriptId.value;
          const name = scriptName.value.trim();
          const status = scriptStatus.value;
          const access = scriptAccess.value;
          const cat = scriptCategory.value;
          const url = scriptImageUrl.value.trim();
          const code = scriptCode.value.trim();
          const price = scriptPrice.value.trim();
          const webhook = webhookUrl.value.trim();

          if (!name) { showToast('Please enter a script name'); scriptName.focus(); return; }
          if (!code) { showToast('Please enter the loadstring code'); scriptCode.focus(); return; }
          if (categories.length === 0) { showToast('Please create a category first'); newCatInput.focus(); return; }

          const finalImage = currentBase64Image || url;

          if (id) {
            const idx = scripts.findIndex(s => s.id === id);
            if (idx !== -1) {
              scripts[idx] = { ...scripts[idx], name, status, access, category: cat, image: finalImage, code, price };
              saveData();
              showToast('Script updated successfully!');
            }
          } else {
            const newScript = {
              id: 'script-' + Date.now(),
              name, status, access, category: cat, image: finalImage, code, price
            };
            scripts.unshift(newScript);
            saveData();
            showToast('Script posted!');
            
            // Send to Discord if webhook exists
            if (webhook) {
               await sendWebhook(newScript, webhook);
               showToast('Sent to Discord Webhook!', true);
            }
          }

          resetForm();
          renderAdmin();
          renderCategories();
          filterPublic();
        };

        cancelEditBtn.onclick = resetForm;
      }

      init();
    })();
  </script>
</body>
</html>
